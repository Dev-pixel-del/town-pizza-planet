<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Town Pizza Planet — Admin Control Center</title>
<link rel="icon" href="/order/logo.jpg">
<style>
:root{--bg:#0a0e13;--panel:#111820;--panel2:#151f29;--line:#263544;--text:#f6f8fb;--muted:#94a3b8;--accent:#ff9f1c;--green:#22c55e;--red:#ef4444;--blue:#60a5fa;--yellow:#f59e0b;--shadow:0 14px 40px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#090d12,#0d141b);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.logo{width:66px;height:66px;border-radius:18px;object-fit:cover;border:1px solid var(--line)}h1,h2,h3,p{margin-top:0}.login input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid var(--line);background:#0b1117;color:var(--text);outline:none}.primary{background:var(--accent);color:#111;border:0;font-weight:800}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:11px}.btn:hover{border-color:#456074}.btn.small{padding:7px 9px;font-size:12px}.btn.danger{color:#fecaca;border-color:#5b2020}.btn.success{color:#bbf7d0}.btn.blue{color:#bfdbfe}.btn.ghost{background:transparent}
.topbar{height:70px;border-bottom:1px solid var(--line);background:rgba(10,14,19,.92);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{display:flex;gap:11px;align-items:center}.brand img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brand strong{display:block;font-size:15px}.brand small{color:var(--muted)}.admin-top-tools{display:flex;gap:12px;align-items:center}.global-search{display:flex;gap:6px;align-items:center}.global-search input{width:min(300px,28vw);padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0b1117;color:var(--text);outline:none}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 70px)}.side{border-right:1px solid var(--line);padding:15px;position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.nav{display:grid;gap:6px}.nav button{display:flex;justify-content:space-between;align-items:center;border:1px solid transparent;background:transparent;color:#cbd5e1;padding:11px 12px;border-radius:11px;text-align:left}.nav button.active,.nav button:hover{background:#151f29;border-color:var(--line);color:var(--text)}.nav button span{color:var(--muted);font-size:11px}.side-foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);font-size:12px}
.content{padding:20px;max-width:1700px;width:100%;margin:0 auto}.page-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.metric .label{font-size:11px;color:var(--muted)}.metric .value{font-size:26px;font-weight:900;margin-top:4px}.metric .sub{font-size:11px;color:var(--muted);margin-top:4px}.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:15px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:10px 9px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#18222c;font-size:11px}.pill.green{color:#bbf7d0}.pill.red{color:#fecaca}.pill.blue{color:#bfdbfe}.pill.orange{color:#fed7aa}.pill.gray{color:#cbd5e1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.toolbar input,.toolbar select,.field input,.field select,.field textarea{background:#0b1117;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px 11px;width:100%}.field{display:grid;gap:6px;margin-bottom:11px}.field label{font-size:11px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.full{grid-column:1/-1}
.order-card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}.order-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.order-id{color:var(--accent);font-weight:900}.order-body{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;margin-top:12px}.items{margin:7px 0 0;padding:0;list-style:none}.items li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06)}.order-actions{display:flex;flex-wrap:wrap;gap:7px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.chart{display:flex;align-items:flex-end;gap:7px;height:170px;padding-top:16px}.bar{flex:1;min-width:15px;display:grid;grid-template-rows:1fr auto;gap:5px;height:100%;align-items:end}.bar i{display:block;background:linear-gradient(180deg,var(--accent),#ff6f2c);border-radius:7px 7px 2px 2px;min-height:3px}.bar small{font-size:9px;color:var(--muted);text-align:center}.progress-list{display:grid;gap:9px}.progress-row{display:grid;grid-template-columns:120px 1fr 70px;gap:8px;align-items:center;font-size:12px}.track{height:8px;background:#0b1117;border-radius:999px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:999px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:70;padding:15px}.modal-card{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;position:sticky;top:0;background:var(--panel);padding-bottom:10px;z-index:2}.toast{position:fixed;right:18px;bottom:18px;background:#17212b;border:1px solid var(--line);padding:12px 14px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.status-select{background:#0b1117;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:7px}
.notice{padding:11px 13px;border:1px solid #66491c;background:#2a2112;border-radius:12px;color:#fde68a;font-size:12px}.danger-note{border-color:#622424;background:#2a1414;color:#fecaca}.success-note{border-color:#1f5d38;background:#10231a;color:#bbf7d0}.image-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.img-card{background:var(--panel2);border:1px solid var(--line);padding:8px;border-radius:12px}.img-card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px}.kbd{border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--muted);font-size:10px}
@media(max-width:1150px){.layout{grid-template-columns:1fr}.side{position:sticky;top:70px;height:auto;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.cards{grid-template-columns:repeat(3,1fr)}.grid2,.order-body{grid-template-columns:1fr}.image-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.admin-top-tools{gap:6px}.global-search input{width:140px}.admin-top-tools .pill{display:none}.content{padding:13px}.cards{grid-template-columns:repeat(2,1fr)}.formgrid,.formgrid.three,.grid3{grid-template-columns:1fr}.topbar{height:62px;padding:0 11px}.layout{min-height:calc(100vh - 62px)}.side{top:62px}.brand small{display:none}.image-grid{grid-template-columns:repeat(2,1fr)}}
@media print{.topbar,.side,.page-head .actions,.no-print{display:none!important}.layout{display:block}.content{max-width:none}.section{box-shadow:none;border:0}}

/* V11 — mobile-first manager UI */
@media(max-width:700px){
  body{font-size:14px}
  .topbar{height:auto;min-height:58px;flex-wrap:wrap;gap:7px;padding:8px 10px;position:relative;top:auto}
  .brand{min-width:0;flex:1 1 44%}
  .brand img{width:38px;height:38px;border-radius:10px}
  .brand strong{font-size:13px;white-space:nowrap}
  .admin-top-tools{flex:1 1 100%;display:flex;gap:6px;width:100%}
  .global-search{flex:1;min-width:0}
  .global-search input{width:100%!important;min-height:40px}
  .global-search button,.admin-top-tools .btn{min-height:40px}
  .admin-top-tools>div:last-child{display:flex;gap:6px}
  .layout{display:block;min-height:0}
  .side{position:sticky;top:0;height:auto;padding:7px 9px;border-right:0;border-bottom:1px solid var(--line);z-index:25;background:rgba(10,14,19,.97);backdrop-filter:blur(12px)}
  .nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;min-height:42px;padding:9px 11px;font-size:12px}
  .side-foot{display:none}
  .content{padding:10px}
  .page-head{gap:10px;margin-bottom:12px}
  .page-head h1{font-size:22px}
  .page-head .actions{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .page-head .actions .btn,.page-head .actions>button,.page-head .actions>span{width:100%;min-height:42px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{padding:12px;border-radius:14px}
  .metric .value{font-size:21px}
  .section{padding:12px;border-radius:15px}
  .toolbar{display:grid;grid-template-columns:1fr;gap:7px}
  .toolbar .btn,.toolbar input,.toolbar select{min-height:42px}
  .formgrid,.formgrid.three,.grid3{grid-template-columns:1fr!important}
  .order-body{grid-template-columns:1fr!important}
  .order-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .order-actions .btn{min-height:42px}
  .modal{padding:8px}
  .modal-card{max-height:94vh;border-radius:16px;padding:13px}
  .modal-head{padding-bottom:8px}
  .modal .btn{min-height:42px}
  .field input,.field select,.field textarea{min-height:42px}
  .table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
}

/* V12 — mobile admin scroll behavior: header scrolls away, navigation stays pinned */
@media(max-width:700px){
  html,body{overflow-x:hidden}
  #app{min-height:100vh}
  .topbar{position:relative!important;top:auto!important;z-index:10}
  .layout{display:block!important}
  .side{position:sticky!important;top:0!important;z-index:50!important}
  .nav{overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .nav button{touch-action:manipulation}
  .content{position:relative;z-index:1}
}

.tpp-alarm-backdrop{position:fixed;inset:0;background:rgba(127,0,0,.35);backdrop-filter:blur(4px);z-index:99999;display:grid;place-items:center;padding:18px;animation:tppAlarmPulse 1s infinite alternate}.tpp-alarm-card{width:min(520px,100%);background:#111827;color:#fff;border:3px solid #ef4444;border-radius:26px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.55);text-align:center}.tpp-alarm-icon{font-size:56px}.tpp-alarm-kicker{font-size:12px;font-weight:900;letter-spacing:.15em;color:#fca5a5;margin-top:8px}.tpp-alarm-card h2{font-size:34px;margin:8px 0}.tpp-alarm-card p{font-size:17px;color:#dbeafe}.tpp-alarm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.tpp-alarm-actions .btn:first-child{grid-column:1/-1}.tpp-alarm-actions .btn{min-height:48px}@keyframes tppAlarmPulse{from{box-shadow:inset 0 0 0 rgba(239,68,68,0)}to{box-shadow:inset 0 0 70px rgba(239,68,68,.16)}}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div id="login" class="login"><div class="login-card"><img class="logo" src="/order/logo.jpg"><h1 style="margin:16px 0 8px">Town Pizza Planet</h1><p class="muted">Admin Control Center</p><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><button class="btn primary" style="width:100%;margin-top:10px" onclick="login()">Sign in</button><div id="loginErr" class="muted" style="margin-top:10px;color:#fca5a5"></div><p class="muted" style="font-size:11px;margin:14px 0 0">Single-owner admin login. Session expires automatically.</p></div></div>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><img src="/order/logo.jpg"><div><strong>Town Pizza Planet</strong><small>Restaurant Control Center</small></div></div><div class="admin-top-tools"><div class="global-search"><input id="globalSearch" placeholder="Search orders, customers, menu…" onkeydown="if(event.key==='Enter')globalSearch()"><button class="btn small" onclick="globalSearch()">🔎</button></div><div style="display:flex;gap:7px;align-items:center"><span id="waDot" class="pill gray">WhatsApp: checking</span><button id="installAdminBtn" class="btn small" onclick="installAdminApp()">📲 Install</button><button id="pushAdminBtn" class="btn small" onclick="enableOrderAlerts()">🔔 Enable Order Alerts</button><button id="testPushBtn" class="btn small" onclick="testOrderAlerts()" disabled>🧪 Test Alert</button><a class="btn small" href="/admin/alerts">🔔 Alerts Page</a><button class="btn small" onclick="refreshCurrent()">↻ Refresh</button><button class="btn small" onclick="logout()">Logout</button></div></div></header>
<div class="layout"><aside class="side"><div class="nav" id="nav"></div><div class="side-foot">Local-first control panel<br><span class="muted">Customer ordering: /order</span></div></aside><main id="content" class="content"></main></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modal-card" id="modalCard"></div></div>
<script src="/admin.js?v=20260911-36"></script>
</body></html>
