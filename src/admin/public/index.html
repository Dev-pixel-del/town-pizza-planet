<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Town Pizza Planet — Orders</title>
<style>
:root{--bg:#0b1015;--card:#131c24;--muted:#8fa1b3;--text:#f7fafc;--accent:#ff9f1c;--green:#22c55e;--red:#ef4444;--line:#22303b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(11,16,21,.96);backdrop-filter:blur(10px);z-index:4}
.brand{font-size:21px;font-weight:800}.brand span{color:var(--accent)}
button{border:1px solid var(--line);background:#16212b;color:var(--text);padding:9px 13px;border-radius:9px;cursor:pointer}button:hover{border-color:#3c5668}
main{max-width:1200px;margin:0 auto;padding:24px}.hidden{display:none!important}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}.login h1{margin-top:0}.login input{width:100%;margin:10px 0 14px;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0d151c;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);padding:18px;border-radius:14px}.stat .v{font-size:25px;font-weight:800;margin-top:4px}.stat .l{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.toolbar button.active{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;gap:14px}.order{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.id{font-weight:800;color:var(--accent)}.status{padding:5px 9px;border-radius:999px;background:#16212b;font-size:11px}.body{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:14px}.muted{color:var(--muted);font-size:12px}.items{list-style:none;padding:0;margin:8px 0}.items li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}.total{font-size:19px;font-weight:800;color:var(--green);text-align:right}.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.map{color:#60a5fa;text-decoration:none}.empty{text-align:center;padding:60px 10px;color:var(--muted)}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>🍕 Town Pizza Planet</h1>
  <p class="muted">Restaurant dashboard</p>
  <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
  <button onclick="login()">Login</button>
  <div id="err" class="muted" style="margin-top:10px;color:#fca5a5"></div>
</div>
<div id="app" class="hidden">
<header><div class="brand">🍕 Town <span>Pizza Planet</span></div><div><button onclick="load()">↻ Refresh</button> <button onclick="logout()">Logout</button></div></header>
<main>
<div class="stats">
  <div class="stat"><div class="l">Today's Orders</div><div id="s1" class="v">0</div></div>
  <div class="stat"><div class="l">Today's Sales</div><div id="s2" class="v">₹0</div></div>
  <div class="stat"><div class="l">Preparing</div><div id="s3" class="v">0</div></div>
  <div class="stat"><div class="l">Ready</div><div id="s4" class="v">0</div></div>
  <div class="stat"><div class="l">Out for Delivery</div><div id="s5" class="v">0</div></div>
</div>
<div class="toolbar" id="filters">
  <button class="active" data-f="all">All</button><button data-f="received">New</button><button data-f="preparing">Preparing</button><button data-f="ready">Ready</button><button data-f="out_for_delivery">Out for delivery</button><button data-f="delivered">Delivered</button><button data-f="cancelled">Cancelled</button>
</div>
<div id="orders" class="grid"></div>
</main></div>
<script>
let filter='all';
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error('Unauthorized')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});showApp();await load()}catch(e){$('err').textContent='Invalid password';}}
async function logout(){await api('/api/logout',{method:'POST'}).catch(()=>{});showLogin()}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
async function check(){try{await api('/api/me');showApp();await load()}catch{} }
async function load(){try{const s=(await api('/api/stats')).stats;$('s1').textContent=s.count;$('s2').textContent='₹'+Number(s.revenue).toLocaleString('en-IN');$('s3').textContent=s.preparing;$('s4').textContent=s.ready;$('s5').textContent=s.outForDelivery;const d=filter==='all'?await api('/api/orders/today'):await api('/api/orders?status='+encodeURIComponent(filter));render(d.orders)}catch(e){console.error(e)}}
function render(orders){if(!orders.length){$('orders').innerHTML='<div class="empty">📭 No orders found.</div>';return} $('orders').innerHTML=orders.map(o=>{const map=o.location?.latitude?`https://www.google.com/maps?q=${o.location.latitude},${o.location.longitude}`:(o.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}`:'');const items=(o.items||[]).map(i=>`<li><span>${esc(i.name)} × ${i.qty}</span><span>₹${i.price*i.qty}</span></li>`).join('');return `<div class="order"><div class="head"><div><div class="id">${o.order_id}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="status">${o.status.replaceAll('_',' ')}</span></div><div class="body"><div><div><b>Customer</b><div>${esc(o.user_name||'Customer')}</div><div class="muted">${esc((o.user_id||'').replace('@c.us',''))}</div></div><div style="margin-top:12px"><b>Delivery</b><div>${o.landmark?'<div>📌 '+esc(o.landmark)+'</div>':''}${o.address?'<div>🏠 '+esc(o.address)+'</div>':''}${map?'<a class="map" target="_blank" href="'+map+'">📍 Open customer location</a>':''}</div></div></div><div><b>Items</b><ul class="items">${items}</ul><div class="total">₹${Number(o.total).toLocaleString('en-IN')}</div><div class="muted" style="text-align:right">🚚 FREE DELIVERY • 💵 COD</div></div></div><div class="actions">${actions(o)}</div></div>`}).join('')}
function actions(o){let a='';if(o.status==='received')a+=btn('preparing','🔥 Start Preparing','orange');if(o.status==='preparing')a+=btn('ready','✅ Mark Ready','green');if(o.status==='ready')a+=btn('out_for_delivery','🛵 Out for Delivery','blue');if(o.status==='out_for_delivery')a+=btn('delivered','✅ Delivered','green');if(['received','preparing','ready'].includes(o.status))a+=btn('cancelled','❌ Cancel','red');return a}
function btn(status,label,color){return `<button onclick="status(this.dataset.id,'${status}')" data-id="${currentId}" data-color="${color}">${label}</button>`}
let currentId='';
function bindIds(){document.querySelectorAll('.order').forEach((el,i)=>{});}
// Re-render with data-id injected by replacing currentId placeholder after render.
const origRender=render;
render=function(orders){if(!orders.length){$('orders').innerHTML='<div class="empty">📭 No orders found.</div>';return} $('orders').innerHTML=orders.map(o=>{const map=o.location?.latitude?`https://www.google.com/maps?q=${o.location.latitude},${o.location.longitude}`:(o.address?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address)}`:'');const items=(o.items||[]).map(i=>`<li><span>${esc(i.name)} × ${i.qty}</span><span>₹${i.price*i.qty}</span></li>`).join('');return `<div class="order"><div class="head"><div><div class="id">${o.order_id}</div><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="status">${o.status.replaceAll('_',' ')}</span></div><div class="body"><div><b>Customer</b><div>${esc(o.user_name||'Customer')}</div><div class="muted">${esc((o.user_id||'').replace('@c.us',''))}</div><div style="margin-top:12px"><b>Delivery</b>${o.landmark?'<div>📌 '+esc(o.landmark)+'</div>':''}${o.address?'<div>🏠 '+esc(o.address)+'</div>':''}${map?'<div><a class="map" target="_blank" href="'+map+'">📍 Open customer location</a></div>':''}</div></div><div><b>Items</b><ul class="items">${items}</ul><div class="total">₹${Number(o.total).toLocaleString('en-IN')}</div><div class="muted" style="text-align:right">🚚 FREE DELIVERY • 💵 COD</div></div></div><div class="actions"><button onclick="status('${o.order_id}','preparing')" ${o.status!=='received'?'disabled':''}>🔥 Start Preparing</button><button onclick="status('${o.order_id}','ready')" ${o.status!=='preparing'?'disabled':''}>✅ Mark Ready</button><button onclick="status('${o.order_id}','out_for_delivery')" ${o.status!=='ready'?'disabled':''}>🛵 Out for Delivery</button><button onclick="status('${o.order_id}','delivered')" ${o.status!=='out_for_delivery'?'disabled':''}>✅ Delivered</button><button onclick="status('${o.order_id}','cancelled')" ${['delivered','cancelled','out_for_delivery'].includes(o.status)?'disabled':''}>❌ Cancel</button></div></div>`}).join('')}
async function status(id,s){try{await api('/api/orders/'+encodeURIComponent(id)+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});await load()}catch(e){alert(e.message)}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;load()}));
setInterval(()=>{if(!$('app').classList.contains('hidden'))load()},30000);
check();
</script>
</body>
</html>
