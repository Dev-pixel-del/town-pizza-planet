<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Town Pizza Planet — Order Alerts</title>
<link rel="icon" href="/order/logo.jpg">
<meta name="theme-color" content="#111827">
<style>
:root{--bg:#0a0e13;--panel:#111820;--panel2:#151f29;--line:#263544;--text:#f6f8fb;--muted:#94a3b8;--accent:#ff9f1c;--green:#22c55e;--red:#ef4444;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#090d12,#0d141b);color:var(--text)}
button,a{font:inherit;color:inherit}.wrap{width:min(760px,100%);margin:0 auto;padding:22px 16px 50px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.top img{width:48px;height:48px;border-radius:14px;object-fit:cover}.top strong{display:block}.top small{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);padding:11px 14px;border-radius:12px;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);color:#111;font-weight:900;border-color:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}.status{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:#0b1117;border:1px solid var(--line);margin:10px 0}.green{color:#bbf7d0}.orange{color:#fed7aa}.red{color:#fecaca}.notice{padding:12px 14px;border-radius:14px;background:#2a2112;border:1px solid #66491c;color:#fde68a;font-size:13px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.order{padding:13px 0;border-top:1px solid rgba(255,255,255,.06)}.order:first-child{border-top:0}.pill{font-size:11px;padding:5px 9px;border-radius:999px;background:#18222c}.small{font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="/order/logo.jpg" alt="Town Pizza Planet"><div><strong>Town Pizza Planet</strong><small>Owner Order Alerts</small></div></div>
  <div id="app"><div class="card"><h1>Order Alerts</h1><p class="muted">Checking admin session…</p></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function ack(id){try{const d=await api('/api/owner-alerts/'+encodeURIComponent(id)+'/ack',{method:'POST'});if(window.opener){} await render();return d}catch(e){alert(e.message)}}
async function enable(){
  try{
    if(!('Notification'in window)||!('serviceWorker'in navigator)||!('PushManager'in window))throw new Error('This phone/browser does not support push alerts.');
    const perm=await Notification.requestPermission();if(perm!=='granted')throw new Error('Notification permission was not granted.');
    const reg=await navigator.serviceWorker.ready;
    const key=(await api('/api/push/public-key')).publicKey;
    const pad='='.repeat((4-key.length%4)%4), raw=atob((key+pad).replace(/-/g,'+').replace(/_/g,'/'));
    const appKey=Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
    let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey});
    await api('/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})});
    await render();
    alert('Order alerts are enabled on this phone.');
  }catch(e){alert(e.message)}
}
async function test(){
  try{
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)return alert('Enable Order Alerts first.');
    const d=await api('/api/push/test',{method:'POST'});alert(`Test alert sent to ${d.sent} device(s).`);
  }catch(e){alert(e.message)}
}
async function render(){
  let me;try{me=await api('/api/me')}catch(e){$('app').innerHTML='<div class="card"><h1>Sign in required</h1><p class="muted">Open the Admin Control Center first, then return here.</p><div class="actions"><a class="btn primary" href="/admin/">Open Admin</a></div></div>';return}
  let ps={deviceCount:0};try{ps=await api('/api/push/status')}catch{}
  let sub=false,perm='unsupported',support=false;
  if('Notification'in window&&'serviceWorker'in navigator&&'PushManager'in window){support=true;perm=Notification.permission;try{sub=Boolean(await (await navigator.serviceWorker.ready).pushManager.getSubscription())}catch{}}
  let pending=[];try{pending=(await api('/api/owner-alerts/pending')).alerts||[]}catch{}
  $('app').innerHTML=`
    <div class="card"><div class="row"><div><h1>🔔 Order Alerts</h1><p class="muted">Signed in for ${String(me.store||'Town Pizza Planet')}</p></div><span class="pill ${sub?'green':'orange'}">${sub?'🟢 ENABLED':'🟠 NOT ENABLED'}</span></div>
      <div class="status"><span>Browser support</span><strong>${support?'READY':'NOT SUPPORTED'}</strong></div>
      <div class="status"><span>Notification permission</span><strong>${perm}</strong></div>
      <div class="status"><span>Registered owner devices</span><strong>${ps.deviceCount||0}</strong></div>
      <div class="notice">A new web order is not confirmed just because you opened it or edited it. You must explicitly press <b>Confirm Order</b> in the alarm/system.</div>
      <div class="actions" style="margin-top:14px"><button class="btn primary" onclick="enable()">🔔 Enable Order Alerts</button><button class="btn" onclick="test()" ${sub?'':'disabled'}>🧪 Test Alert</button><a class="btn" href="/admin/">← Admin</a></div>
    </div>
    <div class="card"><div class="row"><div><h2>Pending owner confirmations</h2><p class="muted">These orders are still waiting for restaurant acknowledgement.</p></div><button class="btn small" onclick="render()">↻ Refresh</button></div>
    ${pending.length?pending.map(x=>`<div class="order"><div class="row"><div><b>${x.order.order_id}</b><div class="muted">${x.order.user_name||'Customer'} · ₹${Number(x.order.total||0).toLocaleString('en-IN')} · ${x.order.delivery_zone||'Delivery'}</div></div><span class="pill red">WAITING</span></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="ack('${String(x.order.order_id).replace(/'/g,"&#39;")}')">✅ Confirm Order</button><a class="btn" href="/admin/?order=${encodeURIComponent(x.order.order_id)}">View in Admin</a></div></div>`).join(''):'<div class="muted" style="padding:16px 0">No pending orders.</div>'}
    </div>`;
}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/admin-sw.js',{scope:'/admin/'}).catch(()=>{}));
render();
</script>
</body>
</html>
