<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120f0d" id="themeColorMeta" />
  <meta name="description" content="Town Pizza Planet — Your town’s favorite slice of the planet." />
  <title>Town Pizza Planet — Your town’s favorite slice of the planet</title>
  <link rel="icon" href="/order/logo.jpg" type="image/jpeg">
  <script>document.documentElement.dataset.theme=localStorage.getItem('tpp_theme')==='light'?'light':'dark';</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/order/styles.css?v=20260905-14" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="grain"></div>
  <header class="topbar">
    <button class="brand" data-home aria-label="Home"><span class="brand-mark"><img class="brand-logo-img" src="/order/logo.jpg" alt="Town Pizza Planet logo"></span><span><strong>Town Pizza Planet</strong><small>Your town’s favorite slice of the planet</small></span></button>
    <div class="header-actions">
      <button type="button" id="vegModeBtn" class="veg-mode-toggle" aria-pressed="false" title="Veg mode"> <span class="veg-toggle-word">VEG</span><span class="veg-switch"><i></i></span></button>
      <button type="button" id="nonVegModeBtn" class="veg-mode-toggle nonveg-mode-toggle" aria-pressed="false" title="Non-veg mode"> <span class="veg-toggle-word">NON-VEG</span><span class="veg-switch nonveg-switch"><i></i></span></button>
      <button type="button" id="themeToggleBtn" class="theme-toggle" aria-pressed="false" title="Light"> <span class="theme-icon">☀️</span><span>Light</span></button>
      <button type="button" id="languageHeaderBtn" class="language-header-btn" data-language-change aria-label="Select language">🌐 <span>Select Language</span><small>English</small></button>
      <a class="icon-header" href="tel:9448769098" aria-label="Call restaurant">📞</a>
      <button class="cart-pill" data-cart><span>🛒</span><b id="cartCount">0</b><span>Cart</span></button>
    </div>
  </header>
  <main id="app" class="app-shell"></main>
  <aside id="cartDrawer" class="cart-drawer" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow">YOUR ORDER</p><h2>Your Cart</h2></div><button class="icon-btn" data-close-cart>✕</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-footer"><div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div><button class="primary-btn wide" data-checkout>Checkout <span>→</span></button></div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <div id="languageModal" class="language-modal" aria-hidden="true"></div>
  <button id="mobileCartBar" class="mobile-cart-bar" type="button" data-cart aria-label="Open cart" aria-hidden="true">
    <span class="mobile-cart-icon">🛒</span>
    <span class="mobile-cart-copy"><strong>View Cart</strong><small><b id="mobileCartCount">0</b> items</small></span>
    <span class="mobile-cart-total" id="mobileCartTotal">₹0</span>
    <span class="mobile-cart-arrow">→</span>
  </button>
  <script src="/order/app.js?v=20260905-14"></script>
</body>
</html>
